<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReadMe</title>
<style>
:root{--bg1:#cfeeff;--bg2:#fff1cf;--cl:rgba(255,255,255,.8);--card:#fff;--ink:#1b2a6b;--hd:#1b2a6b;--edge:#ffd54a;--edgesh:#f0b429;--pri:#8a5cff;--acc:#ff5fa2;--ok:#1fa971;--bad:#ef4444;--soft:#f1ebff;--sh:#d9ccff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a1442;--bg2:#2e1b63;--cl:rgba(255,255,255,.07);--card:#2d2766;--ink:#f6f2ff;--hd:#ffd166;--edge:#6b5bd6;--edgesh:#171244;--soft:#3d3590;--sh:#171244;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1a1442;--bg2:#2e1b63;--cl:rgba(255,255,255,.07);--card:#2d2766;--ink:#f6f2ff;--hd:#ffd166;--edge:#6b5bd6;--edgesh:#171244;--soft:#3d3590;--sh:#171244;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px;background:radial-gradient(circle at 10% 6%,var(--cl) 0 34px,transparent 36px),radial-gradient(circle at 18% 7%,var(--cl) 0 24px,transparent 26px),radial-gradient(circle at 90% 12%,var(--cl) 0 30px,transparent 32px),radial-gradient(circle at 82% 13%,var(--cl) 0 20px,transparent 22px),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
#app{max-width:640px;margin:auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.logo{flex:1;font-size:1.4rem;font-weight:800;cursor:pointer;white-space:nowrap}.logo i{font-style:normal;text-shadow:0 2px 0 rgba(0,0,0,.18);-webkit-text-stroke:1px rgba(255,255,255,.7)}
.hero{width:100%;border-radius:20px;border:3px solid var(--edge);margin-bottom:6px}
.tag{margin:6px auto 0;background:#1b2a6b;color:#fff;text-align:center;font-weight:700;border-radius:24px;padding:10px 16px;font-size:.95rem;max-width:420px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.sticker{display:inline-block;background:#ffe27a;color:#1b2a6b;font-weight:800;border-radius:12px;padding:4px 12px;transform:rotate(-3deg);margin:4px 0}
.pill{border:2px solid var(--sh);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 10px;font:inherit;font-weight:700;box-shadow:0 3px 0 var(--sh);cursor:pointer}
.card{background:var(--card);border:4px solid var(--edge);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 6px 0 var(--edgesh)}
.center{text-align:center}h1{font-size:1.6rem;margin:8px 0;color:var(--hd)}h2{margin:6px 0;color:var(--hd)}
.btn{border:0;border-radius:18px;padding:13px 18px;font:inherit;font-size:1.05rem;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);background:linear-gradient(180deg,#a888ff,#7c4dff);cursor:pointer;box-shadow:0 5px 0 rgba(60,30,140,.45);margin:4px}
.btn.alt{background:linear-gradient(180deg,#ff8ab8,#ff4f95);box-shadow:0 5px 0 rgba(160,20,80,.4)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.mood{border:3px solid rgba(255,255,255,.7);border-radius:22px;background:var(--soft);color:#1b2a6b;font:inherit;font-weight:700;padding:12px 4px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}.mood span{display:block;font-size:2.6rem}.mood:active{transform:translateY(3px)}
.mood:nth-child(1){background:#ffe36e}.mood:nth-child(2){background:#b8f0c8}.mood:nth-child(3){background:#cfe3ff}.mood:nth-child(4){background:#a9c8ff}.mood:nth-child(5){background:#ffc2c2}.mood:nth-child(6){background:#e3d4ff}
.gb{border:3px solid rgba(255,255,255,.6);border-radius:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);font:inherit;font-weight:700;padding:12px 4px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);background:#8a5cff}
.gb:nth-child(1){background:#ff5fa2}.gb:nth-child(2){background:#ff8a3d}.gb:nth-child(3){background:#f2a900}.gb:nth-child(4){background:#1fa971}.gb:nth-child(5){background:#14b8a6}.gb:nth-child(6){background:#3d8bff}.gb:nth-child(7){background:#8a5cff}
.gb.on{outline:4px solid var(--ink);outline-offset:2px;transform:scale(1.07)}
input[type=text]{width:100%;font:inherit;font-size:1.2rem;padding:12px;border-radius:16px;border:3px solid var(--pri);background:var(--card);color:var(--ink);margin:8px 0;text-align:center}
.tile-menu{border:3px solid rgba(255,255,255,.55);border-radius:26px;padding:18px 10px;font:inherit;font-weight:700;font-size:1.1rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.22)}.tile-menu span{display:block;font-size:2.6rem}.tile-menu:active{transform:translateY(3px)}
.opts{display:grid;gap:10px;margin-top:12px}.opt{border:3px solid var(--pri);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem;padding:13px;cursor:pointer;box-shadow:0 4px 0 var(--sh)}.opt:hover{background:var(--soft)}.opt.big{font-size:2.6rem}
.opt:nth-child(2){border-color:#ff5fa2}.opt:nth-child(3){border-color:#14b8a6}.opt:nth-child(4){border-color:#f2a900}
.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.prog{font-size:.9rem;opacity:.75}.prompt{font-size:1.25rem;margin-top:6px}.bigE{font-size:4rem;line-height:1.2}.scene{font-size:2.2rem;line-height:1.5;word-break:break-all}
.pass{font-size:1.35rem;line-height:1.9}.pass span{padding:2px 3px;border-radius:8px}.pass .hl{background:#ffd54a;color:#1b2a6b}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slots,.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:40px;height:48px;border-bottom:4px solid var(--acc);font-size:1.6rem;font-weight:700}.slots.ok .slot{color:var(--ok)}.slots.no .slot{color:var(--bad)}
.tile{width:46px;height:50px;border:0;border-radius:14px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);font:700 1.4rem inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);background:#ff5fa2}.tile:disabled{opacity:.25;box-shadow:none}
.tile:nth-child(5n+2){background:#ff8a3d}.tile:nth-child(5n+3){background:#1fa971}.tile:nth-child(5n+4){background:#3d8bff}.tile:nth-child(5n+5){background:#8a5cff}
.hg{display:grid;gap:3px;grid-template-columns:repeat(var(--n),1fr);max-width:420px;margin:10px auto}
.cell{aspect-ratio:1;border:0;border-radius:9px;background:#fff0a8;color:#1b2a6b;font:700 1rem inherit;padding:0;cursor:pointer}.cell.s{background:var(--acc);color:#fff}.cell.f{background:var(--ok);color:#fff}
.chip{display:inline-block;background:#ffe27a;color:#1b2a6b;border-radius:14px;padding:4px 10px;margin:3px;font-weight:700}.chip.done{text-decoration:line-through;opacity:.5}
</style></head>

<script>
const GL=["Kinder","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6"];
/* Sample content per grade. Text "en|fil" is bilingual. w=[English,emoji,Filipino], r=rhyme pairs */
const D=[
{x:["A cat sat. The cat has a hat. The hat is red.","May pusa. May sombrero ang pusa. Pula ang sombrero."],q:[["What color is the hat?|Anong kulay ng sombrero?",["red|pula","blue|asul","green|berde"],0],["Who has a hat?|Sino ang may sombrero?",["the cat|ang pusa","the dog|ang aso","the fish|ang isda"],0]],w:[["cat","🐱","pusa"],["dog","🐶","aso"],["sun","☀️","araw"],["fish","🐟","isda"],["bus","🚌","bus"],["egg","🥚","itlog"]],r:[["cat","hat"],["dog","log"],["sun","fun"],["bed","red"]]},
{x:["Mia has a dog named Bo. Bo runs in the park. Mia and Bo play ball.","May aso si Mia na si Bo. Tumatakbo si Bo sa parke. Naglalaro ng bola sina Mia at Bo."],q:[["Who is Bo?|Sino si Bo?",["a dog|aso","a cat|pusa","a bird|ibon"],0],["Where does Bo run?|Saan tumatakbo si Bo?",["in the park|sa parke","in school|sa paaralan","in the house|sa bahay"],0]],w:[["apple","🍎","mansanas"],["book","📖","aklat"],["tree","🌳","puno"],["star","⭐","bituin"],["boat","⛵","bangka"],["milk","🥛","gatas"]],r:[["ball","tall"],["bee","tree"],["cake","lake"],["moon","spoon"]]},
{x:["Ben plants a seed in the garden. He gives it water every day. After many days, a green sprout grows.","Nagtanim si Ben ng buto sa hardin. Dinidiligan niya ito araw-araw. Pagkalipas ng ilang araw, tumubo ang berdeng usbong."],q:[["What does Ben plant?|Ano ang itinanim ni Ben?",["a seed|buto","a toy|laruan","a shoe|sapatos"],0],["What grows after many days?|Ano ang tumubo?",["a sprout|usbong","a fish|isda","a house|bahay"],0]],w:[["rabbit","🐰","kuneho"],["flower","🌸","bulaklak"],["rain","🌧️","ulan"],["bread","🍞","tinapay"],["house","🏠","bahay"],["moon","🌙","buwan"]],r:[["light","night"],["boat","coat"],["rain","train"],["bear","chair"]]},
{x:["Lara found a lost puppy near the market. She asked the vendors if anyone owned it. Soon a boy ran up and thanked her with a big smile.","Nakakita si Lara ng nawawalang tuta malapit sa palengke. Tinanong niya ang mga tindero kung may nagmamay-ari nito. Maya-maya, may batang tumakbo at nagpasalamat nang may ngiti."],q:[["Where did Lara find the puppy?|Saan nakita ni Lara ang tuta?",["near the market|malapit sa palengke","at school|sa paaralan","at the beach|sa dalampasigan"],0],["What kind of person is Lara?|Anong uri ng tao si Lara?",["helpful|matulungin","lazy|tamad","shy|mahiyain"],0]],w:[["elephant","🐘","elepante"],["rainbow","🌈","bahaghari"],["turtle","🐢","pagong"],["bridge","🌉","tulay"],["pencil","✏️","lapis"],["mountain","⛰️","bundok"]],r:[["story","glory"],["mouse","house"],["snow","glow"],["play","day"]]},
{x:["Typhoons bring strong winds and heavy rain. Before a storm arrives, families prepare food, water, and flashlights. Staying calm and following advice keeps everyone safe.","Ang bagyo ay may malakas na hangin at ulan. Bago dumating ang bagyo, naghahanda ang pamilya ng pagkain, tubig, at flashlight. Ang pagiging kalmado at pagsunod sa payo ay nagpapanatiling ligtas sa lahat."],q:[["What is the passage mostly about?|Tungkol saan ang talata?",["preparing for a typhoon|paghahanda sa bagyo","how to cook rice|pagluluto ng kanin","a day at the beach|isang araw sa dalampasigan"],0],["What do families prepare?|Ano ang inihahanda ng pamilya?",["food and water|pagkain at tubig","toys|laruan","bicycles|bisikleta"],0]],w:[["volcano","🌋","bulkan"],["library","📚","aklatan"],["tractor","🚜","traktora"],["island","🏝️","pulo"],["hospital","🏥","ospital"],["rocket","🚀","rocket"]],r:[["ocean","motion"],["flower","power"],["ground","sound"],["cheese","breeze"]]},
{x:["The Philippine eagle is one of the largest eagles in the world. It nests high in tall trees deep inside the forest. Because forests are being cut down, fewer eagles survive each year. Protecting the forests will help save this magnificent bird.","Ang agilang Pilipino ay isa sa pinakamalalaking agila sa mundo. Pugad nito ay nasa matataas na puno sa kagubatan. Dahil pinuputol ang mga kagubatan, paunti nang paunti ang nabubuhay na agila. Ang pangangalaga sa kagubatan ang makatutulong na iligtas ang ibong ito."],q:[["Why are fewer eagles surviving?|Bakit paunti nang paunti ang agila?",["forests are cut down|pinuputol ang kagubatan","they fly too high|lumilipad sila nang mataas","they sleep too much|sobra silang matulog"],0],["Which action would help the eagle?|Aling gawain ang makatutulong sa agila?",["protecting forests|pangangalaga sa kagubatan","building more roads|paggawa ng daan","cutting tall trees|pagputol ng puno"],0]],w:[["telescope","🔭","teleskopyo"],["butterfly","🦋","paruparo"],["calendar","📅","kalendaryo"],["umbrella","☂️","payong"],["compass","🧭","kumpas"],["lantern","🏮","parol"]],r:[["island","highland"],["weather","feather"],["mountain","fountain"],["journey","attorney"]]},
{x:["Jose studied every night for the science fair, although his friends invited him to play. On the big day, his project about solar energy won first prize. He realized that patience and hard work can turn small efforts into great achievements.","Nag-aral si Jose gabi-gabi para sa science fair kahit niyaya siyang maglaro ng mga kaibigan. Sa malaking araw, nanalo ng unang gantimpala ang proyekto niya tungkol sa solar energy. Natutunan niyang ang tiyaga at sipag ay nagbubunga ng magagandang tagumpay."],q:[["What is the theme of the story?|Ano ang tema ng kuwento?",["hard work pays off|ang sipag ay may bunga","luck decides everything|swerte ang nagpapasya","games are better than study|mas mabuti ang laro"],0],["What was his project about?|Tungkol saan ang proyekto niya?",["solar energy|solar energy","wind power|lakas ng hangin","recycling|pag-recycle"],0]],w:[["microscope","🔬","mikroskopyo"],["thermometer","🌡️","termometro"],["satellite","🛰️","satelayt"],["dinosaur","🦖","dinosauro"],["fireworks","🎆","paputok"],["parachute","🪂","parasyut"]],r:[["celebrate","decorate"],["station","nation"],["creation","vacation"],["machine","routine"]]}];

let S={lang:"en",stars:0,name:"",grade:-1,mood:-1},cur,Q,P,H,M,FT;
try{S.stars=+(JSON.parse(localStorage.getItem("rm")||"{}").stars)||0}catch(e){}
const sv=()=>{try{localStorage.setItem("rm",JSON.stringify({stars:S.stars}))}catch(e){}};
const $=id=>document.getElementById(id),A=$("app");
const sh=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pick=(a,n)=>sh(a).slice(0,n);
const T=(e,f)=>S.lang==="fil"?f:e;
const L=s=>{const p=s.split("|");return p.length>1&&S.lang==="fil"?p[1]:p[0]};
const esc=s=>s.replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const W=()=>D[S.grade].w,st=()=>D[S.grade].x[S.lang==="fil"?1:0];
const mk=(p,c,wr,big)=>{const o=sh([c,...wr]);return{p,o,a:o.indexOf(c),big}};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.lang==="fil"?"fil-PH":"en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const sayStory=()=>speak(st());
function mascot(s){return `<svg viewBox="0 0 120 120" width="${s}" height="${s}" aria-label="Flam the explorer"><circle cx="60" cy="60" r="58" fill="#ffe9a8"/><path d="M20 78C10 30 38 8 60 8s50 22 40 70c-4 20-16 32-40 32S24 98 20 78z" fill="#3b2a6b"/><ellipse cx="60" cy="68" rx="30" ry="31" fill="#ffd9b8"/><path d="M29 60C31 32 50 26 60 26s29 6 31 34c-11-13-22-17-31-17s-20 4-31 17z" fill="#3b2a6b"/><path d="M28 40C32 12 88 12 92 40z" fill="#ff5d8f"/><rect x="24" y="38" width="72" height="7" rx="3" fill="#e63c78"/><ellipse cx="47" cy="70" rx="8" ry="10" fill="#fff"/><ellipse cx="73" cy="70" rx="8" ry="10" fill="#fff"/><ellipse cx="48" cy="72" rx="5.5" ry="7.5" fill="#2a7de1"/><ellipse cx="72" cy="72" rx="5.5" ry="7.5" fill="#2a7de1"/><circle cx="48" cy="72" r="2.6" fill="#111"/><circle cx="72" cy="72" r="2.6" fill="#111"/><circle cx="45" cy="67" r="2.3" fill="#fff"/><circle cx="69" cy="67" r="2.3" fill="#fff"/><ellipse cx="37" cy="83" rx="5" ry="3" fill="#ff9aa2"/><ellipse cx="83" cy="83" rx="5" ry="3" fill="#ff9aa2"/><path d="M52 89q8 7 16 0" stroke="#c2410c" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>`}
function logo(){return "📖 "+[..."ReadMe"].map((c,i)=>`<i style="color:${["#f0455a","#ff8a1f","#f5b400","#3cb54a","#2f80ed","#9b51e0"][i]}">${c}</i>`).join("")}

function logLogin(){if(!LOG_URL.startsWith("https://"))return;try{fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({name:S.name,grade:GL[S.grade],mood:moods[S.mood]?moods[S.mood][1]:"",lang:S.lang,device:navigator.userAgent})})}catch(e){}}

let AC,muted=false;
function sfx(k){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const n=AC.currentTime,q={tap:[[660,0,.07]],pop:[[880,0,.06],[1175,.06,.1]],ok:[[660,0,.1],[880,.1,.2]],bad:[[240,0,.12,"sawtooth"],[180,.12,.18,"sawtooth"]],win:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.3]],start:[[392,0,.1],[523,.1,.1],[659,.2,.1],[784,.3,.28]]}[k];q.forEach(([f,t,d,w])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w||"triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(.18,n+t+.01);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+d+.03)})}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.classList.contains("opt"))sfx("tap")});

function s0(){cur=s0;render(`<section class="card center"><img class="hero" src="${HERO}" alt="ReadMe: Read, Learn, Grow">${mascot(90)}<h1>${T("Welcome to ReadMe!","Maligayang pagdating sa ReadMe!")}</h1><p>${T("I’m Flam, your reading buddy. Let’s read, learn, and grow together!","Ako si Flam, ang kasama mo sa pagbabasa. Magbasa, matuto, at lumago tayo nang sama-sama!")}</p><div class="row"><button class="btn alt" onclick="sayWelcome()">🔊 ${T("Hear Flam","Pakinggan si Flam")}</button><button class="btn" onclick="begin()">${T("Start ➜","Simulan ➜")}</button></div></section>`)}
const moods=[["😄","Happy","Masaya"],["😊","Good","Mabuti"],["😐","Okay","Ayos lang"],["😢","Sad","Malungkot"],["😠","Angry","Galit"],["😴","Sleepy","Antok"]];
function s1(){cur=s1;render(`<section class="card center">${mascot(110)}<h1>${T("How are you today?","Kumusta ka ngayon?")}</h1><div class="sticker">${T("Small Steps… Big Dreams!","Maliit na Hakbang… Malalaking Pangarap!")}</div><p>${T("Tap the face that matches your feelings.","Piliin ang mukha na kapareho ng nararamdaman mo.")}</p><div class="g g3">${moods.map((m,i)=>`<button class="mood" onclick="setMood(${i})"><span>${m[0]}</span>${T(m[1],m[2])}</button>`).join("")}</div></section>`)}
function setMood(i){S.mood=i;const m=moods[i];const msg=i<2?T("Wonderful! Let’s read and have fun!","Ang saya! Magbasa tayo!"):i==2?T("That’s okay! Let’s read something fun.","Ayos lang! Magbasa tayo ng masaya."):T("It’s okay to feel that way. Reading can help you feel better!","Ayos lang ang ganyang pakiramdam. Makakatulong ang pagbabasa!");
render(`<section class="card center"><div class="bigE">${m[0]}</div>${mascot(90)}<h2>${msg}</h2><button class="btn" onclick="s2()">${T("Next ➜","Susunod ➜")}</button></section>`)}
function s2(){cur=s2;render(`<section class="card center">${mascot(120)}<h1>${T("Hi! I’m Flam, your reading buddy!","Kumusta! Ako si Flam, kasama mo sa pagbabasa!")}</h1><input type="text" id="nm" maxlength="14" placeholder="${T("Your name or codename","Pangalan o codename mo")}" value="${esc(S.name)}"><p><b>${T("Choose your grade","Piliin ang baitang mo")}</b></p><div class="g g3">${GL.map((g,i)=>`<button class="gb ${S.grade==i?"on":""}" onclick="setG(${i})">${g}</button>`).join("")}</div><p id="err" style="color:var(--bad)"></p><button class="btn alt" onclick="go()">${T("Let’s Go! 🚀","Tara na! 🚀")}</button></section>`)}
function setG(i){S.grade=i;document.querySelectorAll(".gb").forEach((b,k)=>b.classList.toggle("on",k==i))}
function go(){const v=$("nm").value.trim();if(S.grade<0){$("err").textContent=T("Pick your grade first!","Pumili muna ng baitang!");return}S.name=v||"Reader";logLogin();home()}

function menu(title,back,items){cur=()=>menu(title,back,items);render(`<section class="card center"><h1>${title}</h1><div class="g g2">${items.map(i=>`<button class="tile-menu" style="background:${i[4]}" onclick="${i[3]}()"><span>${i[0]}</span>${T(i[1],i[2])}</button>`).join("")}</div></section><button class="btn" onclick="${back}()">⬅ ${T("Back","Bumalik")}</button>`)}
function home(){cur=home;render(`<section class="card center">${mascot(90)}<h1>${T("Hi","Kumusta")}, ${esc(S.name)}!</h1><p>${GL[S.grade]} · ${T("What shall we do today?","Ano ang gagawin natin ngayon?")}</p></section><div class="g"><button class="tile-menu" style="background:#2f80ed" onclick="readMenu()"><span>📚</span>${T("Reading Session","Sesyon sa Pagbasa")}</button><button class="tile-menu" style="background:#ff8a1f" onclick="gameMenu()"><span>🎮</span>${T("Interactive Games","Mga Larong Interaktibo")}</button></div>`)}
function readMenu(){menu(T("Reading Session","Sesyon sa Pagbasa"),"home",[["📖","Short Stories","Maikling Kuwento","story","#f0455a"],["🔤","Word Recognition","Pagkilala ng Salita","recog","#3cb54a"],["⏱️","Fluency","Katatasan","flu","#ff8a1f"],["🖼️","Picture Reading","Pagbasa ng Larawan","pic","#9b51e0"]])}
function gameMenu(){menu(T("Interactive Games","Mga Larong Interaktibo"),"home",[["🧩","Puzzle","Palaisipan","pz","#9b51e0"],["🔎","Word Hunt","Hanap-Salita","wh","#14b8a6"],["🕵️","Man Hunt","Hanap-Tiktik","mh","#ff8a1f"],["📝","Vocabulary","Bokabularyo","vocab","#2f80ed"],["🎵","Rhyming Words","Salitang Magkatugma","rhyme","#f0455a"]])}

/* quiz engine */
function quiz(qs){Q={qs,i:0,sc:0,lock:0};qshow()}
function qshow(){const q=Q.qs[Q.i];render(`<section class="card"><div class="prog">${Q.i+1}/${Q.qs.length}</div><div class="prompt">${q.p}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt ${q.big?"big":""}" onclick="qans(${j},this)">${o}</button>`).join("")}</div><p id="fb" class="center"></p></section>`)}
function qans(j,b){if(Q.lock)return;Q.lock=1;const q=Q.qs[Q.i],ok=j===q.a;sfx(ok?"ok":"bad");if(ok){Q.sc++;S.stars++;sv()}b.classList.add(ok?"ok":"bad");document.querySelectorAll(".opt")[q.a].classList.add("ok");$("fb").textContent=ok?T("⭐ Great!","⭐ Magaling!"):T("Try again next time!","Subukan ulit sa susunod!");setTimeout(()=>{Q.lock=0;Q.i++;Q.i<Q.qs.length?qshow():fin(`${Q.sc}/${Q.qs.length} ${T("correct","tama")}`)},1100)}
function fin(t){sfx("win");render(`<section class="card center"><div class="bigE">🏆</div><h2>${T("Great job","Magaling")}, ${esc(S.name)}!</h2><p>${t||""}</p><div class="bigE">⭐ ${S.stars}</div><button class="btn" onclick="cur()">${T("Play again","Ulitin")}</button><button class="btn alt" onclick="home()">🏠</button></section>`)}

/* Reading Session */
function story(){cur=story;render(`<section class="card"><h2>📖 ${GL[S.grade]}</h2><p class="pass">${st()}</p><div class="row"><button class="btn" onclick="sayStory()">🔊 ${T("Listen","Pakinggan")}</button><button class="btn alt" onclick="storyQ()">❓ ${T("Questions","Mga Tanong")}</button></div></section><button class="btn" onclick="readMenu()">⬅</button>`)}
function storyQ(){quiz(D[S.grade].q.map(q=>mk(L(q[0]),L(q[1][q[2]]),q[1].filter((_,k)=>k!=q[2]).map(L))))}
function recog(){cur=recog;const w=W();quiz(pick(w,5).map(x=>mk(`${T("Find the picture for","Hanapin ang larawan ng")} <b style="font-size:1.8rem">${x[0]}</b>`,x[1],pick(w.filter(y=>y!=x),2).map(y=>y[1]),1)))}
function flu(){cur=flu;render(`<section class="card"><h2>⏱️ ${T("Read along!","Magbasa nang sabay!")}</h2><p class="pass">${st().split(" ").map((w,i)=>`<span id="w${i}">${w}</span>`).join(" ")}</p><label>${T("Speed","Bilis")}: 🐢 <input id="sp" type="range" min="30" max="140" value="60"> 🐇</label><div class="row"><button class="btn" onclick="fluGo()">▶ ${T("Start","Simulan")}</button><button class="btn alt" onclick="sayStory()">🔊</button></div><p id="msg" class="center"></p></section><button class="btn" onclick="readMenu()">⬅</button>`)}
function fluGo(){clearInterval(FT);const n=st().split(" ").length;let i=0;document.querySelectorAll(".pass span").forEach(s=>s.classList.remove("hl"));FT=setInterval(()=>{if(i>0)$("w"+(i-1)).classList.remove("hl");if(i>=n){clearInterval(FT);S.stars++;sv();sfx("win");$("msg").textContent="🎉 "+T("Well read! +1 ⭐","Mahusay! +1 ⭐");return}$("w"+i).classList.add("hl");i++},60000/$("sp").value)}
function pic(){cur=pic;const w=W(),qs=[];for(let k=0;k<4;k++){const[a,b]=pick(w,2),na=1+Math.random()*Math.min(5,2+S.grade)|0,nb=1+Math.random()*3|0;const sc=sh([...Array(na).fill(a[1]),...Array(nb).fill(b[1])]).join(" ");const wr=[];for(const d of sh([1,2,3,4,5,6,7].filter(x=>x!=na))){if(wr.length<2)wr.push(d)}qs.push(mk(`<div class="scene">${sc}</div>${T("How many","Ilan ang")} <b>${T(a[0],a[2])}</b>?`,na,wr))}quiz(qs)}

/* Interactive Games */
function vocab(){cur=vocab;const w=W();quiz(pick(w,5).map((x,i)=>i%2?mk(`<span class="bigE">${x[1]}</span><br>${T("What is","Ano ang English ng")} <b>${x[2]}</b>${T(" in English?","?")}`,x[0],pick(w.filter(y=>y!=x),2).map(y=>y[0])):mk(`<span class="bigE">${x[1]}</span><br>${T("What is","Ano ang Filipino ng")} <b>${x[0]}</b>${T(" in Filipino?","?")}`,x[2],pick(w.filter(y=>y!=x),2).map(y=>y[2]))))}
function rhyme(){cur=rhyme;const r=D[S.grade].r;quiz(r.map(x=>mk(`🎵 ${T("Which word rhymes with","Aling salita ang tugma sa")} <b>${x[0]}</b>?`,x[1],pick(r.filter(y=>y!=x).map(y=>y[1]),2))))}
function pz(){cur=pz;P={it:pick(W(),4),i:0,lock:0};pzN()}
function pzN(){if(P.i>=4)return fin();const Wd=P.it[P.i][0].toUpperCase();let t;do{t=sh(Wd.split(""))}while(t.join("")==Wd);P.W=Wd;P.t=t;P.u=[];pzD()}
function pzD(){const b=P.u.map(k=>P.t[k]).join("");render(`<section class="card center"><div class="prog">${P.i+1}/4 · ${T("Spell the word","Buuin ang salita")}</div><div class="bigE">${P.it[P.i][1]}</div><div class="slots">${P.W.split("").map((c,j)=>`<span class="slot">${b[j]||""}</span>`).join("")}</div><div class="tiles">${P.t.map((c,k)=>`<button class="tile" ${P.u.includes(k)?"disabled":""} onclick="pzT(${k})">${c}</button>`).join("")}</div><button class="btn" onclick="P.u=[];pzD()">↩</button></section><button class="btn" onclick="gameMenu()">⬅</button>`)}
function pzT(k){if(P.lock)return;P.u.push(k);pzD();if(P.u.length==P.W.length){const b=P.u.map(k=>P.t[k]).join(""),ok=b==P.W;document.querySelector(".slots").classList.add(ok?"ok":"no");P.lock=1;sfx(ok?"ok":"bad");if(ok){S.stars++;sv()}setTimeout(()=>{P.lock=0;if(ok){P.i++;pzN()}else{P.u=[];pzD()}},800)}}
function wh(){cur=wh;const ws=pick(W(),4).map(x=>x[0].toUpperCase()),n=Math.min(12,Math.max(6,Math.max(...ws.map(s=>s.length))+1));let g=Array(n*n).fill("");const dirs=S.grade>2?[[0,1],[1,0],[1,1]]:[[0,1],[1,0]];
ws.forEach(w=>{for(let t=0;t<200;t++){const[a,b]=dirs[Math.random()*dirs.length|0],r=Math.random()*n|0,c=Math.random()*n|0;if(r+a*(w.length-1)>=n||c+b*(w.length-1)>=n)continue;let ok=1;for(let k=0;k<w.length;k++){const v=g[(r+a*k)*n+c+b*k];if(v&&v!=w[k])ok=0}if(!ok)continue;for(let k=0;k<w.length;k++)g[(r+a*k)*n+c+b*k]=w[k];break}});
g=g.map(v=>v||String.fromCharCode(65+Math.random()*26|0));H={g,n,ws,left:[...ws],sel:[],f:new Set(),ml:Math.max(...ws.map(s=>s.length))};whD()}
function whD(){const em=Object.fromEntries(W().map(x=>[x[0].toUpperCase(),x[1]]));render(`<section class="card center"><h2>🔎 ${T("Find the hidden words","Hanapin ang mga nakatagong salita")}</h2><div>${H.ws.map(w=>`<span class="chip ${H.left.includes(w)?"":"done"}">${S.grade<3?em[w]+" ":""}${w}</span>`).join("")}</div><div class="hg" style="--n:${H.n}">${H.g.map((c,i)=>`<button class="cell ${H.f.has(i)?"f":H.sel.includes(i)?"s":""}" onclick="whC(${i})">${c}</button>`).join("")}</div><p>${T("Tap the letters in order.","Pindutin ang mga letra nang magkakasunod.")}</p></section><button class="btn" onclick="gameMenu()">⬅</button>`)}
function whC(i){H.sel.includes(i)?H.sel=H.sel.filter(k=>k!=i):H.sel.push(i);const s=H.sel.map(k=>H.g[k]).join(""),hit=H.left.find(w=>w==s||w==[...s].reverse().join(""));if(hit){H.left=H.left.filter(x=>x!=hit);H.sel.forEach(k=>H.f.add(k));H.sel=[];S.stars++;sv();sfx("ok");if(!H.left.length){whD();return void setTimeout(()=>fin(),700)}}else if(H.sel.length>=H.ml)H.sel=[];whD()}
function mh(){cur=mh;M={i:0};mhN()}
function mhN(){if(M.i>=4)return fin();const it=pick(W(),5),row=sh([...it.map(x=>[x[1],x[0]]),["🕵️",""]]),m=row.findIndex(x=>!x[1]),left=m>0,nb=row[left?m-1:m+1];M.m=m;
const clue=left?T(`The detective stands right after the <b>${nb[1]}</b>.`,`Ang tiktik ay nasa kanan ng <b>${nb[1]}</b>.`):T(`The detective stands right before the <b>${nb[1]}</b>.`,`Ang tiktik ay nasa kaliwa ng <b>${nb[1]}</b>.`);
render(`<section class="card center"><div class="prog">${M.i+1}/4</div><h2>🕵️ ${T("Find the hidden detective!","Hanapin ang nakatagong tiktik!")}</h2><p class="prompt">${clue}</p><div class="row">${row.map((x,j)=>`<button class="opt big" style="width:84px" onclick="mhC(${j},this)">${x[0]==="🕵️"?"❓":x[0]}</button>`).join("")}</div></section><button class="btn" onclick="gameMenu()">⬅</button>`)}
function mhC(j,b){if(j==M.m){b.textContent="🕵️";b.classList.add("ok");sfx("ok");S.stars++;sv();setTimeout(()=>{M.i++;mhN()},800)}else{sfx("bad");b.classList.add("bad")}}
s0();
</script></body></html>
